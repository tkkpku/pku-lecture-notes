# ignored_lectures 示例 —— 复制成 config/ignored_lectures.yaml
# ============================================================================
# 作用：明确跳过某些讲次，避免对「空录像 / 习题课 / 已搬走的课」反复白跑
#      （一次白跑 = 下载 ~900 MB + 预检 15 s + 可能整讲 ASR）。
#
# [warn] 这个文件用 **utf-8-sig** 读（允许 BOM），而 config.yaml 用**纯 utf-8**（见
#    docs/PITFALLS.md）。两者策略不同是历史原因，别混。
#
# 字段说明：
#   course      课程名（与 raw/ 下的目录名一致）
#   match       可选的模糊匹配串（命中课程名/讲次即忽略）
#   video_id    教学网回放 ID（最精确；不知道就留空）
#   lecture     讲次名，如「第03讲」
#   date        录像日期 YYYY-MM-DD
#   reason      为什么忽略（写清楚，未来你会感谢自己）
#   workdir     该讲中间产物目录（可选，用于记录）
# ============================================================================

ignored: []

# 示例（按需要取消注释并改成你自己的）：
# ignored:
#   - course: "某门课"
#     video_id: "0000000000000000"
#     lecture: "第10讲"
#     date: "2026-09-08"
#     reason: "回放为空文件（0 字节）"
#   - course: "某门课"
#     match: "习题课"
#     reason: "习题课无板书，参考价值低"
